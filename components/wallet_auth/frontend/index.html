<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 4px 0; }
    /* Бренд-кольори (UX-A5): градієнт/радіус/рух як у theme.py і login Connect. */
    button {
      background: linear-gradient(135deg, #6e56cf, #9e8cfc); color: #fff; border: none;
      border-radius: 12px; padding: 10px 16px; font-size: 14px; font-weight: 600;
      cursor: pointer; width: 100%;
      transition: box-shadow .25s cubic-bezier(.4,0,.2,1),
                  transform .15s cubic-bezier(.4,0,.2,1), filter .25s cubic-bezier(.4,0,.2,1);
    }
    button:hover { filter: brightness(1.06); box-shadow: 0 4px 20px rgba(110,86,207,.4); }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 2px solid #9e8cfc; outline-offset: 2px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { font-size: 12px; color: #6b7280; margin-top: 6px; }
    .err { color: #dc2626; }
  </style>
</head>
<body>
  <button id="connect" type="button">🦊 Connect MetaMask</button>
  <div id="status"></div>
  <script>
    // Мінімальний міст Streamlit custom component (без CDN unpkg.com).
    const Streamlit = {
      events: { addEventListener: (type, cb) => window.addEventListener("message", (e) => {
        if (e.data && e.data.type === type) cb();
      })},
      RENDER_EVENT: "streamlit:render",
      getComponentArgs: () => window.__streamlitArgs || {},
      setComponentValue: (value) => post("streamlit:setComponentValue", { value }),
      setFrameHeight: (height) => post("streamlit:setFrameHeight", { height }),
    };
    function post(type, data) {
      window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data || {}), "*");
    }
    window.addEventListener("message", (event) => {
      if (!event.data || event.data.type !== "streamlit:render") return;
      window.__streamlitArgs = event.data.args || {};
      onRender();
    });
    post("streamlit:componentReady", { apiVersion: 1 });

    const btn = document.getElementById("connect");
    const status = document.getElementById("status");
    let busy = false;

    function setStatus(msg, isErr) {
      status.textContent = msg || "";
      status.className = isErr ? "err" : "";
    }

    function sendValue(value) {
      Streamlit.setComponentValue(value);
    }

    async function connectAndSign(nonce) {
      if (busy) return;
      if (!nonce) {
        setStatus("Waiting for nonce…", false);
        btn.disabled = true;
        return;
      }
      btn.disabled = false;
      if (!window.ethereum) {
        sendValue({ error: "NO_METAMASK" });
        setStatus("MetaMask not found", true);
        return;
      }
      busy = true;
      btn.disabled = true;
      setStatus("Confirm in MetaMask…", false);
      try {
        const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
        const address = accounts[0];
        const issued = new Date().toISOString().replace(/\.\d{3}Z$/, "Z");
        const message =
          "NFT Prompt Builder — Sign-In\n" +
          "Wallet: " + address + "\n" +
          "Nonce: " + nonce + "\n" +
          "Issued: " + issued;
        const signature = await window.ethereum.request({
          method: "personal_sign",
          params: [message, address],
        });
        sendValue({ address, message, signature });
        setStatus("Signed ✓", false);
      } catch (e) {
        sendValue({ error: String(e.message || e) });
        setStatus(String(e.message || e), true);
      } finally {
        busy = false;
        btn.disabled = false;
      }
    }

    function onRender() {
      const args = Streamlit.getComponentArgs() || {};
      const nonce = args.nonce || "";
      btn.onclick = () => connectAndSign(nonce);
      if (!nonce) {
        btn.disabled = true;
        setStatus("Click «Connect MetaMask» in app first", false);
      } else {
        btn.disabled = false;
        setStatus("", false);
      }
      Streamlit.setFrameHeight(72);
    }

    onRender();
  </script>
</body>
</html>
